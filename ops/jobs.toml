[[jobs]]
job_id = "trading-engine-p16-challengers"
version = 1
authority = "shadow"
enabled = false
argv = ["%h/trading-engine/.venv/bin/python", "-m", "server.p16_challenger_runner", "--run"]
schedules = ["Tue..Sat *-*-* 03:00:00 UTC"]
locks = [
  { name = "job:trading-engine-p16-challengers", mode = "exclusive", wait_seconds = 0, timeout_status = "superseded" },
  { name = "market-writer", mode = "exclusive", wait_seconds = 60, timeout_status = "retryable_failure" },
]

[jobs.timeout]
attempt_seconds = 32400
overall_seconds = 98400

[jobs.retry]
max_attempts = 3
exit_codes = [1]
backoff_seconds = [300, 300]
deadline_seconds = 98400

[jobs.catch_up]
mode = "latest"
max_age_seconds = 86400
max_count = 1

[jobs.legacy.service]
unit = "trading-engine-p16-challengers.service"
description = "Trading engine P16 pre-entry challenger family"
after = ["network-online.target", "trae-proxy.service", "trading-engine-p15-scoring.service"]
wants = ["network-online.target", "trae-proxy.service"]
start_limit_interval = "30min"
start_limit_burst = 3
type = "exec"
exec_start = [{ argv = ["%h/trading-engine/.venv/bin/python", "-m", "server.p16_challenger_runner", "--run"] }]
environment = ["PYTHONUNBUFFERED=1"]
nice = 19
io_scheduling_class = "idle"
timeout_start = "9h"
runtime_max_comments = ["# systemd 241 stops applying TimeoutStartSec to Type=exec once exec succeeds."]
runtime_max = "9h"
private_tmp = true
protect_system = "full"
protect_control_groups = true
umask = "0077"
restart = "on-failure"
restart_sec = "5min"

[jobs.legacy.timer]
unit = "trading-engine-p16-challengers.timer"
description = "Run P16 challengers after the P15 nightly scoring job"
on_calendar = ["Tue..Sat *-*-* 03:00:00 UTC"]
persistent = true
service_unit = "trading-engine-p16-challengers.service"


