schema_version = 1
maximum_receipt_retention_days = 180

[defaults]
owner = "public-engine"
repository = "trading-engine"
authority = "data"
enabled = true
runner_enabled = false
runner_mode = "blocked"
calendar = "always"
parameters = {}
locks = [{ name = "job:{job_id}", mode = "exclusive", wait_seconds = 0, timeout_status = "superseded" }]

[defaults.idempotency]
template = "{job_id}:{version}:{scheduled_for}"
completion_probe = { kind = "receipt" }

[defaults.run_record]
retention_days = 180

[defaults.timeout]
attempt_seconds = 600
term_grace_seconds = 30
overall_seconds = 600

[defaults.retry]
max_attempts = 1
exit_codes = []
backoff_seconds = []
deadline_seconds = 600

[defaults.alert]
severity = "FAIL"
grace_seconds = 300

[defaults.catch_up]
mode = "none"
max_age_seconds = 0
max_count = 0

[defaults.approval]
kind = "none"

[defaults.resources]
nice = 19
io_scheduling_class = "idle"
cpu_quota_percent = 0
memory_high_bytes = 0
memory_max_bytes = 0
minimum_available_memory_bytes = 0
tasks_max = 0
scratch_bytes = 0
output_bytes = 0
min_free_bytes = 0
unlimited_reason = "audit-only parity; legacy scheduler remains the resource authority"


[[jobs]]
job_id = "run-daily"
version = 1
authority = "paper"
argv = ["{repo}/engine/run_daily.sh"]
schedules = ["Mon..Fri *-*-* 22:30:00 UTC"]
calendar = "UTC-weekday"
locks = [
  { name = "job:run-daily", mode = "exclusive", wait_seconds = 0, timeout_status = "superseded" },
  { name = "market-writer", mode = "exclusive", wait_seconds = 0, timeout_status = "terminal_failure" },
]

[jobs.timeout]
attempt_seconds = 32400
overall_seconds = 32400

[jobs.retry]
deadline_seconds = 32400

[jobs.legacy.cron]
name = "run_daily"
fields = "30 22 * * 1-5"
log = "logs/cron.log"
append = true


