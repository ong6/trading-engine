name: setup-engine
description: >-
  Python 3.12, uv and the locked dev virtualenv. The virtualenv is cached on the runner OS,
  the exact Python version and uv.lock; a stale one restored by prefix is brought to the
  lock by `uv sync --frozen`, which removes anything the lock does not list. It is saved
  right after the sync, before any test can write into it.
runs:
  using: composite
  steps:
    - run: ln -sfn "$GITHUB_WORKSPACE" "$HOME/trading-engine"  # service units use %h/trading-engine
      shell: bash
    - id: python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - uses: astral-sh/setup-uv@v6
      with:
        version: "0.11.29"
        enable-cache: false  # every locked package is a wheel, which its pruned cache drops
    - id: venv
      uses: actions/cache/restore@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-uv0.11.29-${{ hashFiles('uv.lock') }}
        restore-keys: |
          venv-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-uv0.11.29-
    - run: uv sync --extra dev --frozen
      shell: bash
    - if: steps.venv.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: .venv
        key: ${{ steps.venv.outputs.cache-primary-key }}
