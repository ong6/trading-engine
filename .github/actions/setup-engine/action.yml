name: setup-engine
description: >-
  Python 3.12, uv and the locked dev virtualenv. The virtualenv is cached on the runner OS,
  the exact Python version and uv.lock; a stale one restored by prefix is brought to the
  lock by `uv sync --frozen`, which removes anything the lock does not list. It is saved
  right after the sync and a bytecode compile, before any test can write into it.
inputs:
  uv-version:
    description: uv release to install; part of the virtualenv cache key
    default: "0.11.29"
runs:
  using: composite
  steps:
    - run: ln -sfn "$GITHUB_WORKSPACE" "$HOME/trading-engine"  # service units use %h/trading-engine
      shell: bash
    - id: python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - uses: astral-sh/setup-uv@v6
      with:
        version: ${{ inputs.uv-version }}
        enable-cache: false  # every locked package is a wheel, which its pruned cache drops
    - id: venv
      uses: actions/cache/restore@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-uv${{ inputs.uv-version }}-${{ hashFiles('uv.lock') }}
        restore-keys: |
          venv-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-uv${{ inputs.uv-version }}-
    - run: uv sync --extra dev --frozen
      shell: bash
    # bytecode at both optimization levels, so the tests that start `python -O` (and every
    # worker's first imports) read it instead of compiling the import closure themselves
    - run: .venv/bin/python -m compileall -q -j 0 -o 0 -o 1 .venv/lib engine sim server farm tools
      shell: bash
    - if: steps.venv.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: .venv
        key: ${{ steps.venv.outputs.cache-primary-key }}
