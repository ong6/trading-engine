name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check public repository hygiene
        env:
          PUBLIC_HYGIENE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PUBLIC_HYGIENE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: PYTHONPATH="$GITHUB_WORKSPACE" python -m tools.public_hygiene --ci
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz: [UTC, Asia/Singapore]
        shard: [0, 1, 2, 3]
    env:
      TZ: ${{ matrix.tz }}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # registration tests read git history for the last registered change
      - run: ln -sfn "$GITHUB_WORKSPACE" "$HOME/trading-engine"  # service units use %h/trading-engine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --extra dev --frozen
      - run: .venv/bin/python -m pytest -q -W error -n auto --test-shards=4 --test-shard=${{ matrix.shard }}
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # registration tests read git history for the last registered change
      - run: ln -sfn "$GITHUB_WORKSPACE" "$HOME/trading-engine"  # service units use %h/trading-engine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --extra dev --frozen
      - run: uv export --frozen --no-dev --no-emit-project --no-annotate --output-file /tmp/runtime-requirements.txt
      - run: uvx --from pip-audit==2.10.1 pip-audit -r /tmp/runtime-requirements.txt --disable-pip --strict --progress-spinner off
      - run: uv build --wheel --out-dir /tmp/trading-engine-wheel
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff check --select C90 server tools
        continue-on-error: true  # advisory; see docs/feedback.md 2026-09-26
      - run: .venv/bin/ruff check --select PLW2901 server tools
      - run: .venv/bin/ruff check --select RET504 server tools
      - run: .venv/bin/ruff check --select S101 engine farm sim server tools
      - run: .venv/bin/python -m compileall -q engine sim server tests farm tools
      - run: find engine -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - run: bash -n server/run_server.sh ui/run_ui.sh
  ui-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm test
      - uses: actions/cache@v4
        with:
          path: ui/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('ui/package-lock.json') }}-${{ hashFiles('ui/app/**', 'ui/next.config.*', 'ui/jsconfig.json', 'ui/tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('ui/package-lock.json') }}-
      - run: npm run build
