[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-engine"
version = "0.1.0"
description = "Fully local paper-trading bot and research engine: DuckDB market store, nightly screen, pre-registered strategy league, conservative fill simulator, backtest and walk-forward farm."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.6",
    "ruff>=0.12",
]

[tool.setuptools.dynamic]
dependencies = { file = ["engine/requirements.txt"] }

[tool.setuptools.packages.find]
include = ["engine*", "farm*", "server*", "sim*", "tools*"]
namespaces = false

[tool.setuptools.package-data]
farm = ["experiments/*.json", "experiments/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --dist=worksteal"
# `slow`: over about 5 s (setup, call and teardown) in a full -n 8 run. Every run still
# runs them; `-m "not slow"` is for local iteration. On main, CI fails a test that is not
# marked slow and takes longer than --duration-budget seconds (tests/speed_plugin.py).
markers = ["slow: takes over about 5 seconds; still part of every full run"]
# Parallel by default: pytest -n auto (pytest-xdist). Use -n 0 to debug serially.
# Steal pending tests from busy workers instead of leaving a late heavy chunk;
# tests/speed_plugin.py starts each worker on its share of the recorded slow
# tests (tests/durations.json, refreshed with --record-durations).

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["ui", "scratch", ".venv", "archive"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]
