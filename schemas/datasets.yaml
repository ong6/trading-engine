    kind: file_set
    location: store/pit/free-sources/**
    schema_owner: [engine/free_sources.py, engine/free_sec.py, tools/free_sources.py, tools/free_sec.py]
    producer: Tiingo, Massive grouped-daily, and SEC raw capture
    readers: [free-source loaders and audit]
    semantics: append_only_evidence
    clock_and_key: Content hash, request identity, received time, and receipt
    retention: Keep logical bytes; lossless compression may replace only an exactly verified encoding.
    backup: Current research checkpoint required before local retirement.
    rebuild: not_rebuildable as the same response without retained bytes
    registration: P3 research-only evidence
    quality_gate: Decompressed byte length and SHA-256 equal the receipt

  - id: files.massive_minute_raw
    kind: file_set
    location: store/pit/massive-minute/**
    schema_owner: [engine/free_massive_minute.py, tools/free_massive_minute.py]
    producer: Massive minute capture
    readers: [minute loader, resume logic, offline audit]
    semantics: append_only_evidence_and_progress
    clock_and_key: Page content hash or ticker/window chunk identity
    retention: Keep raw pages and mutable chunk receipts with the database/WAL cohort.
    backup: Owner RPO decision pending.
    rebuild: Raw pages are unique observations; progress receipts are reconstructable only from the complete cohort.
    registration: Frozen host-only minute capture manifest
    quality_gate: Response hash, window coverage, deduplication, and resumability

  - id: files.options_raw
    kind: file_set
    location: store/pit/options/**
    schema_owner: engine/free_massive_options.py
    producer: Future Massive options capture
    readers: [future options loader and audit]
    semantics: append_only_evidence
    clock_and_key: Request, contract, session, and response hash
    retention: Keep with options.duckdb and receipts as one recoverable cohort.
    backup: Excluded until capture activation names an RPO.
    rebuild: not_rebuildable as the same response without retained bytes
    registration: Research-only; no execution authority
    quality_gate: Receipt hash and contract/session identity

  - id: files.retired_pit_archives
    kind: file_set
    location: store/pit/{sec-bulk,short-data,frozen-archive}/**
    schema_owner: [engine/free_sec_bulk.py, tools/free_sec_bulk.py, tools/free_frozen_archive.py]
    producer: Retired SEC bulk, short-data, and frozen-archive tools
    readers: [offline restore on demand]
    semantics: remote_only_append_only_evidence
    clock_and_key: Exact release asset and member hashes
    retention: Local payloads retired; retain catalogue entry and restore instructions.
    backup: Exact private research release identified by store/pit/RESTORE.md.
    rebuild: Fetch and verify the exact release; never create empty old paths.
    registration: P3 evidence archive
    quality_gate: Release asset and member hash verification

  - id: files.price_verifier_receipts
    kind: file_set
    location: data/price-verify/**
    schema_owner: engine/verify_prices.py
    producer: Independent price verifier
    readers: [meta, board, backup]
    semantics: append_only_evidence
    clock_and_key: Response SHA-256 and request metadata
    retention: Never subject to generic report or log retention.
    backup: Recovery bundle mirrors every completed member.
    rebuild: not_rebuildable as the same response
    registration: Price verification evidence contracts
    quality_gate: Exact response bytes, metadata identity, and digest

  - id: files.committed_operational_outputs
    kind: file_set
    location: data/{_meta.json,universe.csv,eod/**,screens/**,reports/**}
    schema_owner: [engine/resources.py, engine/universe.py, engine/screen.py, sim/league.py, farm/**/*.py]
    producer: Engine, simulator, farm, evaluation, and metrics renderers
    readers: [API, board, operators, registrations, recovery]
    semantics: derived_and_registered_evidence
    clock_and_key: Output-specific market date, run identity, source hash, and registration
    retention: Keep current operational artifacts and every registered or frozen report; delete only named unreferenced derived outputs.
    backup: Required subset is included in the recovery bundle; committed data is pushed separately.
    rebuild: Derived outputs may render from exact retained tables and inputs; registered reports are retained byte-for-byte.
    registration: Release manifests and trial registrations pin selected files.
    quality_gate: Atomic writes, source identity, renderer determinism, and report/table equality

  - id: files.operational_logs
    kind: file_set
    location: logs/**
    schema_owner: [engine/lib/driver.sh, tools/ops_digest.py, server/*.service]
    producer: Drivers, services, observers, and operations digest
    readers: [driver monitor, scheduler monitor, ops digest, operators]
    semantics: diagnostic_and_derived_metrics
    clock_and_key: Run, service, timestamp, inode, and cursor offset
    retention: Source logs require bounded rotation with cursor preservation; metrics 180 days and reports 30 days.
    backup: Diagnostic logs are excluded except named recovery artifacts such as friday-postflight.json.
    rebuild: not_rebuildable after source rotation; metrics can be regenerated only while sources remain
    registration: No trading authority; selected postflight evidence may be release-bound.
    quality_gate: Cursor-safe rotation, visible failures, and no response-receipt deletion

  - id: files.research_scratch
    kind: file_set
    location: scratch/**
    schema_owner: [farm/backtest, farm/walkforward, farm/sweep, farm/experiment]
    producer: Offline research and proof runners
    readers: [the owning job]
    semantics: cache
    clock_and_key: Job, source generation, configuration, and process identity
    retention: Delete after successful durable reports; preserve only explicitly pinned incident inputs.
    backup: Excluded.
    rebuild: Re-run from the exact named immutable input generation.
    registration: Scratch never grants strategy authority.
    quality_gate: Private per-job paths, cleanup on success, and durable report identity

  - id: external.private_operational_backup
    kind: external_backup
    location: private-backup/engine/{schema.sql,manifest.json,tables/**,evidence/**,bundle-manifest.json}
    schema_owner: Private backup repository
    producer: Daily backup exporter
    readers: [disaster restore]
    semantics: immutable_backup_generations
    clock_and_key: Backup commit, bundle manifest, schema, table segment, and evidence hashes
    retention: Immutable Parquet deltas in private Git with complete restore checks.
    backup: This is the off-host backup target.
    rebuild: Restore every manifest sequentially and verify the complete database and evidence tree.
    registration: Recovery boundary, not strategy authority
    quality_gate: Same-host restore every run and periodic independently fetched remote restore

  - id: external.private_research_release
    kind: external_backup
    location: private-research-release/**
    schema_owner: Private data evidence archive
    producer: Research evidence archive publisher
    readers: [offline PIT restore]
    semantics: immutable_backup_generation
    clock_and_key: Release identity, asset identity, member length, and SHA-256
    retention: Retain exact fixed checkpoints and their restore instructions.
    backup: This is the off-host research archive target.
    rebuild: Fetch the exact release and verify every member before loading.
    registration: P3 fixed evidence checkpoints
    quality_gate: Independent fetched restore and exact member verification
