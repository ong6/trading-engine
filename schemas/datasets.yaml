catalogue_version: 2
source_baseline: revision-15

# YAML merges keep repeated policy text readable. After safe_load every item under
# datasets is a complete, independent contract with all required fields.
policy_templates:
  market_projection: &market_projection
    schema_owner: [engine/lib/db.py, sim/schema.py]
    producer: [operational engine writers]
    readers: [screen, simulator, P15, API, research, backup]
    semantics: mutable_projection
    clock_and_key: Natural row key plus market date and last admitted source observation.
    retention: Retain while operational or cited; projections may be replaced only from the same evidence vintage.
    backup: Daily verified private logical export and rolling operational generations.
    rebuild: Recompute only from exact retained evidence; otherwise restore the exact backup vintage.
    registration: [P15 revision 15, frozen forward records]
    quality_gate: Admission, unique-key, finite-value, and exact-vintage equality checks.
  market_evidence: &market_evidence
    schema_owner: [engine, server, sim]
    producer: [named operational producer]
    readers: [engine, API, research, backup]
    semantics: append_only_evidence
    clock_and_key: Stable source or decision key plus event, availability, ingestion, and revision clocks.
    retention: Retain every row used by a decision, registration, or recovery proof indefinitely.
    backup: Daily verified private logical export and registered recovery bundle.
    rebuild: not_rebuildable; restore exact retained rows and source identities.
    registration: [operational evidence contracts]
    quality_gate: Canonical identity, append-only replay, and source/decision timestamp checks.
  market_authoritative: &market_authoritative
    schema_owner: [engine, sim]
    producer: [deterministic operational ledger]
    readers: [execution, settlement, risk, API, backup]
    semantics: authoritative
    clock_and_key: Stable account or event identity plus effective and recorded timestamps.
    retention: Retain authoritative rows permanently for every frozen or active account cohort.
    backup: Daily verified private logical export and complete recovery bundle.
    rebuild: not_rebuildable; projections may fold from these rows but these rows restore exactly.
    registration: [P22 accounts, P15 revision 15]
    quality_gate: Chronological replay, account isolation, canonical identity, and money equality within 0.005.
  operational_state: &operational_state
    schema_owner: [engine, server, sim]
    producer: [owning operational service]
    readers: [engine, API, operators, backup]
    semantics: current_state
    clock_and_key: Stable entity key and latest committed state transition.
    retention: Keep current state plus authoritative transition evidence required to reproduce it.
    backup: Daily verified private logical export.
    rebuild: Fold the complete authoritative event sequence and verify before replacing state.
    registration: [operational runtime contract]
    quality_gate: State/event reconciliation and atomic update checks.
  derived_rows: &derived_rows
    schema_owner: [engine, farm, server]
    producer: [deterministic renderer or computation]
    readers: [engine, research, reports]
    semantics: derived
    clock_and_key: Input generation identity plus computation version and natural output key.
    retention: Retain registered outputs; unregistered rows may be replaced after exact-input rebuild proof.
    backup: Registered outputs are included in recovery; ordinary derived rows may be excluded.
    rebuild: Recompute from the exact named input generation and source version.
    registration: [none]
    quality_gate: Deterministic equality to exact retained inputs.
  p15_evidence: &p15_evidence
    schema_owner: [sim/p15_books.py, engine/p15_evaluation.py, engine/p15_event_sources.py, server/p15_preopen.py, server/p15_price_fetch_attempts.py, server/p15_scoring_store.py]
    producer: [P15 scoring, pre-open, event, label, and book runners]
    readers: [P15 reports, league, registration validators, API, backup]
    semantics: append_only_evidence
    clock_and_key: Registered run, window, sample, receipt, or intent identity plus market and recorded clocks.
    retention: Retain terminal evidence, attempts, receipts, and registered cohorts indefinitely.
    backup: Daily verified private logical export and registered recovery bundle.
    rebuild: not_rebuildable; source decisions, labels, attempts, and receipts restore exactly.
    registration: [server/p15-registration.json revision 15]
    quality_gate: Registered hashes, prospective eligibility, exact labels, and deterministic book replay.
  p15_state: &p15_state
    schema_owner: [sim/p15_books.py, engine/p15_event_sources.py]
    producer: [P15 book and event runners]
    readers: [P15 runners, reports, API, backup]
    semantics: current_state
    clock_and_key: Registered book or source key and latest processed window.
    retention: Keep current state and the complete registered evidence sequence that reconstructs it.
    backup: Daily verified private logical export and registered recovery bundle.
    rebuild: Fold the complete registered event, intent, fill, and receipt sequence.
    registration: [server/p15-registration.json revision 15]
    quality_gate: Replay equality, registered identity, and money reconciliation within 0.005.
  inert_evidence: &inert_evidence
    schema_owner: [server, engine]
    producer: [inactive plan-owned producer]
    readers: [offline validators]
    semantics: append_only_evidence
    clock_and_key: Registered record identity and recorded timestamp.
    retention: Empty until activation; after use retain registered evidence indefinitely.
    backup: Excluded until a separately admitted activation includes recovery coverage.
    rebuild: Empty schema is reproducible; any recorded evidence is not_rebuildable.
    registration: [separate activation required]
    quality_gate: Canonical hashes and no execution or broker authority before activation.
  pit_active: &pit_active
    schema_owner: [isolated PIT loader]
    producer: [isolated research collector]
    readers: [offline research, account read-only attachment]
    semantics: append_only_evidence
    clock_and_key: Provider natural key plus availability, request, and ingestion identity.
    retention: Retain logical rows and exact raw receipts; never substitute a newer vendor vintage.
    backup: Requires a current research evidence checkpoint; primary daily backup excludes PIT.
    rebuild: Rebuild only from exact retained raw bodies and receipts.
    registration: [research-only data contract]
    quality_gate: Raw hash, point-in-time availability, admission checks, and restore equality.
  pit_remote: &pit_remote
    schema_owner: [retired isolated PIT loader]
    producer: [retired research collector]
    readers: [offline restore, account read-only attachment]
    semantics: append_only_evidence
    clock_and_key: Source natural key plus original availability and publication dates.
    retention: Local payload retired after exact off-host proof; retain catalogue identity and restore recipe.
    backup: Release research-evidence-20261005-f7d4f695396c-52da75c8; manifest SHA-256 f7d4f695396c6eb013a1238d612920748ba2d153c6cbf071da577f90ec755e06.
    rebuild: Restore the exact release through docs/history/retired-pit-restore-2026-10-18.md; never create an empty replacement.
    registration: [P3 evidence archive]
    quality_gate: Exact release manifest, member digests, required relations, and read-only restore.
  research_cache: &research_cache
    schema_owner: [farm]
    producer: [offline research or proof runner]
    readers: [owning job]
    semantics: cache
    clock_and_key: Job, source generation, configuration, and process identity.
    retention: Delete after successful durable output unless an incident or registration pins it.
    backup: Excluded; durable reports carry input and source identities.
    rebuild: Re-run against the exact named immutable input generation.
    registration: [scratch has no strategy authority]
    quality_gate: Private job path, exact input identity, deterministic output, and cleanup on success.
  operational_file: &operational_file
    schema_owner: [owning engine component]
    producer: [owning operational writer]
    readers: [engine, API, operators, backup]
    semantics: current_state
    clock_and_key: File-family natural identity, exact bytes, and last committed update.
    retention: Keep current operational state and any registered generations.
    backup: Include the named recovery subset in the verified bundle.
    rebuild: Restore the exact backup or rebuild only from the named authoritative source.
    registration: [operational file contract]
    quality_gate: Atomic write, byte identity, and reader compatibility.
  evidence_file: &evidence_file
    schema_owner: [owning evidence producer]
    producer: [named evidence producer]
    readers: [audit, research, backup]
    semantics: append_only_evidence
    clock_and_key: Content hash plus request, source, and availability identity.
    retention: Retain logical source bytes while any evidence or registration cites them.
    backup: Preserve through the named exact backup or evidence release.
    rebuild: not_rebuildable as the same observation without exact retained bytes.
    registration: [evidence source contract]
    quality_gate: Exact byte length, digest, receipt, and restore equality.
  derived_file: &derived_file
    schema_owner: [engine, farm, server]
    producer: [deterministic report or metric renderer]
    readers: [API, board, operators, research]
    semantics: derived
    clock_and_key: Output path plus exact input generation and renderer identity.
    retention: Keep registered outputs; replace ordinary outputs only after exact-input rebuild proof.
    backup: Registered subset is included in recovery or committed data history.
    rebuild: Render from exact retained inputs with the same source version.
    registration: [release manifests may pin selected outputs]
    quality_gate: Atomic publication and deterministic report-to-input equality.
  remote_file: &remote_file
    schema_owner: [retired data producer]
    producer: [retired research collector]
    readers: [offline restore]
    semantics: append_only_evidence
    clock_and_key: Release tag, manifest identity, member path, length, and SHA-256.
    retention: Local payload retired; retain its exact recovery identity indefinitely.
    backup: Release research-evidence-20261005-f7d4f695396c-52da75c8; manifest SHA-256 f7d4f695396c6eb013a1238d612920748ba2d153c6cbf071da577f90ec755e06.
    rebuild: Restore through docs/history/retired-pit-restore-2026-10-18.md; never create an empty old path.
    registration: [P3 evidence archive]
    quality_gate: Independently fetched manifest and exact member verification.

