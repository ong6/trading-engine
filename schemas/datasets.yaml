      - table:macro_signals
      - table:pit_import_batches
      - table:pit_import_rows
    schema_owner: [engine/lib/db.py, engine/pit_import.py]
    producer: [engine.fundamentals, engine.earnings, engine.signals, engine.pit_import]
    readers: [screens, strategies, P15, research, readiness]
    semantics: append_only_evidence
    clock_and_key: Natural fact key plus source availability, ingestion, and revision clocks
    retention: Retain every vintage used by a decision.
    backup: Daily verified private logical export.
    rebuild: Only from exact retained raw bytes with original availability metadata; otherwise restore backup.
    registration: Registered strategies and research cohorts may pin individual vintages.
    quality_gate: Bitemporal visibility, source receipt equality, and no latest-row collapse

  - id: operational.queue_and_experiments
    kind: duckdb_objects
    location: store/market.duckdb
    deployment: revision_15
    objects: [table:jobs, table:job_resolutions, table:experiment_results]
    schema_owner: [engine/lib/db.py, engine/job_resolutions.py, farm/experiment.py]
    producer: [engine.queue_runner, engine.job_resolutions, farm.experiment]
    readers: [drivers, ops, farm, E1 monitor]
    semantics: current_state_and_frozen_results
    clock_and_key: Job identity and state transition time; experiment identity and run time
    retention: Retain failures, resolutions, and frozen experiment results; prune scratch only after a receipt-backed rebuild is named.
    backup: Daily verified private logical export.
    rebuild: Job state is not rebuildable; reports may be rendered from retained result rows.
    registration: E1 and registered experiments pin their result identity.
    quality_gate: Terminal-state consistency, explicit resolutions, and report equality

