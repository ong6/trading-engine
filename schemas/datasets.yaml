catalogue_version: 1
source_baseline: revision-15
contract:
  coverage: Every persistent CREATE TABLE, VIEW, or SEQUENCE declaration and every managed file family is listed exactly once.
  deployment_state: Catalogue coverage does not imply that built-inert, scratch, future, or remote-only objects are present in the operational database.
  temporary_objects: TEMP and TEMPORARY relations are connection-scoped working state and are not datasets.

datasets:
  - id: operational.daily_prices
    kind: duckdb_objects
    location: store/market.duckdb
    deployment: revision_15
    objects:
      - table:prices
      - table:intraday_prices
      - table:price_observation_rejects
      - table:price_quarantine
    schema_owner: [engine/lib/db.py, sim/schema.py]
    producer: [engine.collect, engine.intraday, engine.actions]
    readers: [screen, simulator, P15, farm, API, verifier, backup]
    semantics: mutable_projection_and_append_only_evidence
    clock_and_key: ticker and session; rejects additionally preserve observed_at and source identity
    retention: Retain trusted projections and every reject while any decision or evidence refers to them.
    backup: Daily verified private logical export; operational snapshots retain two generations.
    rebuild: not_rebuildable; restore the exact backup vintage because historical provider responses are incomplete
    registration: P15 and frozen forward records pin valid price semantics and source identities.
    quality_gate: OHLC geometry, finite positive prices, basis verification, session calendar, and exact reject receipts

  - id: operational.universe_and_screens
    kind: duckdb_objects
    location: store/market.duckdb
    deployment: revision_15
    objects: [table:universe, table:universe_snapshot, table:screen_results]
    schema_owner: engine/lib/db.py
    producer: [engine.universe, engine.screen]
    readers: [collect, screen, league, API, farm]
    semantics: current_state_and_point_in_time_evidence
    clock_and_key: universe ticker; snapshots and screens keyed by as_of/run_date plus ticker
    retention: Retain registered and frozen cohorts indefinitely; current universe is mutable.
    backup: Daily verified private logical export.
    rebuild: Current reports are derived; historical snapshots and screen rows must restore from the exact backup vintage.
    registration: Frozen research and forward records pin historical cohorts.
    quality_gate: Unique keys, point-in-time membership, and report-to-table equality

  - id: operational.corporate_actions
    kind: duckdb_objects
    location: store/market.duckdb
    deployment: revision_15
    objects: [table:corporate_actions, table:split_adjustments, table:actions_fetch_log]
    schema_owner: engine/lib/db.py
    producer: engine.actions
    readers: [price reconciliation, simulator, settlement, evidence monitors]
    semantics: authoritative_and_append_only_evidence
    clock_and_key: ticker, action type, ex-date, source availability, and adjudication identity
    retention: Preserve every accepted action, adjudication, and fetch outcome.
    backup: Daily verified private logical export.
    rebuild: Exact retained raw receipt where available; otherwise restore the exact backup vintage.
    registration: P15 and account replay depend on action semantics.
    quality_gate: Source identity, split-basis reconciliation, replay equality, and append-only audit

  - id: operational.fundamental_event_macro_pit
    kind: duckdb_objects
    location: store/market.duckdb
    deployment: revision_15
    objects:
